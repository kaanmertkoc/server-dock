name: Tests and dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          enable-cache: "false"
      - name: Install the checked-out commit with verified dependencies
        env:
          SERVER_DOCK_INSTALL_DIR: ${{ runner.temp }}/server-dock-install
          SERVER_DOCK_BIN_DIR: ${{ runner.temp }}/server-dock-bin
          SERVER_DOCK_PYTHON: python
        run: |
          ./scripts/install.sh "$(git rev-parse HEAD)"
          dirname "$(readlink "$SERVER_DOCK_BIN_DIR/server-dock")" >> "$GITHUB_PATH"
      - run: python -m unittest -v
      - run: server-dock --help
      - name: Check the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          server-dock --version
          python -c 'import importlib.metadata, server_dock; assert importlib.metadata.version("server-dock") == server_dock.__version__'
      - name: Build distributions offline with the locked backend
        run: uv build --offline --no-build-isolation --python "$(command -v python)"
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python scripts/audit_dependencies.py
