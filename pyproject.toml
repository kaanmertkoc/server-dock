[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "server-dock"
version = "0.1.3"
description = "A small, keyboard-first SSH address book for your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual==8.2.8", "rich==15.0.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.scripts]
server-dock = "server_dock:main"

[tool.setuptools]
py-modules = ["server_dock"]

[tool.setuptools.data-files]
"share/server-dock" = ["themes.json"]

[dependency-groups]
build = ["setuptools==84.2.1"]

[tool.uv]
required-version = "==0.13.5"
exclude-newer = "7 days"
