[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "server-dock"
dynamic = ["version"]
description = "A small, keyboard-first SSH address book for your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual==8.2.8"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.scripts]
server-dock = "server_dock:main"

[tool.setuptools]
py-modules = ["server_dock"]

[tool.setuptools.data-files]
"share/server-dock" = ["themes.json"]

[tool.setuptools.dynamic]
version = {attr = "server_dock.__version__"}
